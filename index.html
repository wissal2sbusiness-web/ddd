<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WESIE | Official Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #070305;
      color: #fff;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 45px 20px;
      text-align: center;
    }

    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,3,5,0.48) 0%, rgba(7,3,5,0.25) 50%, rgba(7,3,5,0.75) 100%);
      z-index: 0;
    }

    .top-section,
    .middle-section,
    .bottom-section {
      position: relative;
      z-index: 1;
    }

    .top-section {
      margin-top: 18px;
      animation: fadeInDown 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .sparkle {
      font-size: 15px;
      color: #dfb15b;
      margin-bottom: 7px;
      text-shadow: 0 0 12px rgba(223, 177, 91, 0.55);
      animation: pulseSparkle 2.4s infinite ease-in-out;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 8px;
      color: #ffffff;
      margin-bottom: 5px;
      text-shadow: 0 2px 18px rgba(0,0,0,0.55);
    }

    .brand-subtitle {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 5.5px;
      color: #dfb15b;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .middle-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 310px;
      animation: zoomIn 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .enter-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 54px;
      background: rgba(245, 230, 208, 0.93);
      color: #2b2b2b;
      font-family: 'Cinzel', serif;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 2.5px;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      background: #ffffff;
      transform: translateY(-2px) scale(1.02);
    }

    .click-here-text {
      display: none;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 17px;
      color: #f5e6d0;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
      opacity: 0;
      transform: translateY(12px);
    }

    .click-here-text.animate-in {
      display: block;
      animation: professionalReveal 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .primary-dest-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      background: rgba(245, 230, 208, 0.96);
      color: #2b2b2b;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 35px;
      border: 1.5px solid rgba(255,255,255,0.6);
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      transition: all 0.35s ease;
    }

    .primary-dest-btn.animate-in {
      display: flex;
      animation: 
        professionalReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards,
        softFloat 3.2s ease-in-out 1s infinite;
    }

    .primary-dest-btn:hover {
      background: #ffffff;
      transform: translateY(-3px) scale(1.03) !important;
      box-shadow: 0 12px 32px rgba(245, 230, 208, 0.4);
      animation-play-state: paused;
    }

    .bottom-section {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeInUp 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      width: 100%;
    }

    .tease-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 15.5px;
      color: #f0e6d8;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 9px rgba(0,0,0,0.8);
      max-width: 270px;
      line-height: 1.5;
    }

    .social-icons-row {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 11px;
      margin-top: 2px;
      opacity: 0;
      transform: translateY(16px);
      flex-wrap: wrap;
    }

    .social-icons-row.animate-in {
      display: flex;
      animation: professionalReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .social-icon-link {
      width: 37px;
      height: 37px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(245, 230, 208, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5e6d0;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(5px);
    }

    .social-icon-link:hover {
      transform: translateY(-3px) scale(1.12);
      background: rgba(245, 230, 208, 0.22);
      border-color: #fff;
      color: #fff;
      box-shadow: 0 0 14px rgba(245, 230, 208, 0.35);
    }

    .social-icon-link svg {
      width: 15px;
      height: 15px;
    }

    /* Soft attention on Stacked */
    .stacked-icon {
      border-color: rgba(245, 230, 208, 0.55) !important;
      animation: softGlow 2.4s ease-in-out infinite;
    }

    .footer-signature {
      font-family: 'Cinzel', serif;
      font-size: 8.5px;
      letter-spacing: 2.8px;
      color: #a8a8a8;
      text-transform: uppercase;
      margin-top: 3px;
    }

    #security-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 3, 5, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 20px;
    }

    .modal-box {
      background: rgba(20, 10, 15, 0.95);
      border: 1px solid rgba(245, 230, 208, 0.28);
      border-radius: 22px;
      width: 100%;
      max-width: 320px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0,0,0,0.75);
      animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      letter-spacing: 2.8px;
      color: #fff;
      margin-bottom: 11px;
    }

    .modal-desc {
      font-size: 12.5px;
      color: #d1d1d1;
      margin-bottom: 22px;
      line-height: 1.55;
    }

    .scanner-loader {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(245, 230, 208, 0.18);
      border-top-color: #f5e6d0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes professionalReveal {
      0% { opacity: 0; transform: translateY(18px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulseSparkle {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes softFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes softGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 230, 208, 0.25); }
      50% { box-shadow: 0 0 0 8px rgba(245, 230, 208, 0); }
    }
  </style>
</head>
<body>

  <!-- Video Background -->
  <video class="bg-video" autoplay muted loop playsinline webkit-playsinline>

      <div class="social-icons-row" id="social-icons-row">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <a href="https://www.threads.net" class="social-icon-link" target="_blank" rel="noopener external" aria-label="Threads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10c0 2.21-.88 4.31-2.43 5.86-1.55 1.55-3.65 2.43-5.86 2.43h-1.71c-1.89 0-3.43-1.54-3.43-3.43V12a3 3 0 1 0-6 0c0 1.66 1.34 3 3 3h4"></path>
          </svg>
        </a>
        <a href="https://patreon.com/Wsl2s" class="social-icon-link" target="_blank" rel="noopener external" aria-label="Patreon">

      </div>

      <div class="footer-signature">With Love, Wesie</div>
    </div>
  </div>

  <div id="security-modal">
    <div class="modal-box">
      <div class="modal-title">HUMAN VERIFICATION</div>
      <div class="scanner-loader"></div>
      <p class="modal-desc" id="security-status">Scanning session & filtering bots...</p>
    </div>
  </div>

  <script>
    function startSecurityScan() {
      const modal = document.getElementById('security-modal');
      const statusText = document.getElementById('security-status');
      
      modal.style.display = 'flex';
      statusText.innerText = "Scanning device fingerprint...";
      
      setTimeout(() => {
        statusText.innerText = "Validating human interaction...";
      }, 700);
      
      setTimeout(() => {
        modal.style.display = 'none';
        document.getElementById('main-action-btn').style.display = 'none';
        
        document.getElementById('click-here-text').classList.add('animate-in');
        document.getElementById('exclusive-btn').classList.add('animate-in');
        document.getElementById('social-icons-row').classList.add('animate-in');
      }, 1500);
    }
  </script>
</body>
</html>
